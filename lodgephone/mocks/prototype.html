<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Lodge Phone: tap around</title>
<style>
:root{--paper:#f3ede2;--ink:#18100a;--dim:#8a7e70;--line:#e2d9cb;--acc:#c4531e;--ok:#2f9e5b;--warn:#d99a1e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font:15px/1.4 -apple-system,system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
#app{position:relative;height:100%;max-width:480px;margin:0 auto;overflow:hidden}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--paper);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.off{transform:translateX(100%)}
.hdr{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.hdr b{flex:1;color:var(--acc)}.ib{width:36px;height:36px;display:grid;place-items:center;border-radius:10px;font-size:19px;color:var(--acc)}
.tabs{display:flex;gap:6px;padding:8px 12px 0}.tab{flex:1;padding:6px 0;border-radius:9px;background:#e6ddcf;font-size:12px;font-weight:700}.tab.on{background:#fff;box-shadow:0 1px 3px #0002}
.scroll{flex:1;overflow-y:auto}
.sky{background:linear-gradient(#1d1830,#3b2f52);padding:10px 8px 0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.f{display:flex;flex-direction:column;align-items:center;width:84px;flex:none;padding-bottom:6px}
.f .n{font-size:11px;font-weight:700;background:#fffdf6;border-radius:9px;padding:1px 7px;margin-bottom:2px}
.f img{width:66px;height:66px;image-rendering:pixelated}.f .w{font-size:10px;font-weight:700;color:#e8f1dc;background:#1a3a18aa;border-radius:6px;padding:0 6px;margin-top:2px}
.f.busy img{animation:gnaw .5s steps(2) infinite}.f.busy .w{background:#fffdf6;color:var(--acc)}
@keyframes gnaw{50%{transform:translateY(-2px) rotate(-3deg)}}
.f:active{transform:scale(.94)}
.search{margin:10px 12px 4px;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:0 12px;height:42px}
.search input{flex:1;border:0;outline:0;font-size:16px;background:none}
.sec{padding:12px 14px 4px;font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--dim);text-transform:uppercase}
.row{display:flex;align-items:center;gap:11px;width:100%;padding:9px 14px;border-bottom:1px solid var(--line);text-align:left}
.row:active{background:#18100a0d}.row img{width:46px;height:46px;image-rendering:pixelated;border-radius:50%;flex:none}
.row .m{flex:1;min-width:0}.row .t{display:flex;gap:8px;align-items:baseline}.row .t b{font-family:ui-monospace,monospace}.row .t small{margin-left:auto;color:var(--dim);font-size:12px}
.row .p{color:var(--dim);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .p.fr{color:var(--ink);font-weight:500}.dot{width:10px;height:10px;border-radius:50%;background:var(--acc);flex:none}
.wait{color:#b9800f}.work{color:var(--ok)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 4px;padding:4px 10px}.grid button{display:flex;flex-direction:column;align-items:center;font-size:11.5px}.grid img{width:56px;height:56px;image-rendering:pixelated}
.ring img{border-radius:50%;box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--ok)}.ring.w img{box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--warn)}
.askc{margin:4px 12px 8px;background:#fff;border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:12px;padding:10px 12px}
.btns{display:flex;gap:6px;margin-top:8px}.btns button{flex:1;padding:8px 0;border-radius:9px;background:var(--paper);border:1px solid var(--line);font-size:13px}.btns .y{background:var(--acc);color:#fff;border:0}
.fab{position:absolute;right:16px;bottom:20px;background:var(--acc);color:#fff;border-radius:24px;padding:11px 18px;font-weight:700;box-shadow:0 4px 14px #0004}
.sheetbg{position:absolute;inset:0;background:#18100a59;opacity:0;pointer-events:none;transition:opacity .2s}.sheetbg.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:78%;background:var(--paper);border-radius:18px 18px 0 0;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:0 -6px 24px #0003}
.sheet.on{transform:none}.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:8px auto}
.card{display:flex;gap:12px;align-items:center;padding:4px 16px 10px}.card img{width:70px;height:70px;image-rendering:pixelated}.card b{font-size:19px;font-family:ui-monospace,monospace}
.sess{display:flex;align-items:center;gap:8px;padding:10px 16px;border-top:1px solid var(--line)}.sess .m{flex:1;min-width:0;text-align:left}.sess .m b{display:block;font-size:14.5px}.sess .m span{display:block;font-size:12.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.term{width:38px;height:38px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--acc);font-weight:700;font-size:13px}
.msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.b{max-width:80%;border-radius:18px;padding:9px 12px;font-size:15px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:transform .15s}
.b.w{background:#fff;border:1px solid var(--line);align-self:flex-start}.b.h{background:#f6d9c9;align-self:flex-end}.b.held{transform:scale(1.04);box-shadow:0 8px 24px #0003}
.pin{margin:6px auto;font-size:11.5px;color:var(--ok);background:#eaf6ee;border-radius:10px;padding:3px 10px}
.comp{display:flex;gap:8px;padding:8px 10px 14px;border-top:1px solid var(--line);background:#fffdf8}.comp input{flex:1;border:1px solid var(--line);border-radius:20px;padding:10px 14px;font-size:16px;outline:0}.comp button{width:42px;height:42px;border-radius:50%;background:var(--acc);color:#fff;font-size:18px}
.menu{position:absolute;inset:0;background:#18100a59;backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px}.menu.on{display:flex}
.emo{background:#fff;border-radius:24px;padding:6px 8px;display:flex;gap:4px;font-size:24px}.emo button{width:40px;height:40px}
.acts{background:#fff;border-radius:16px;min-width:230px;padding:6px 0}.acts button{display:block;width:100%;text-align:left;padding:13px 20px;font-size:16px}
.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:12px;padding:9px 14px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}.toast.on{opacity:1}
.typing{align-self:flex-start;color:var(--dim);font-size:13px}
</style></head><body><div id="app">
<section id="home" class="screen">
 <div class="hdr"><span class="ib">☰</span><b class="mono">~/lodge</b></div>
 <div class="tabs"><button class="tab on" data-v="now">Now</button><button class="tab" data-v="list">A · list</button><button class="tab" data-v="grid">B · grid</button><button class="tab" data-v="ask">C · inbox</button></div>
 <div class="scroll" id="homebody"></div>
 <button class="fab" id="newchat">＋ Chat</button>
</section>
<section id="dm" class="screen off">
 <div class="hdr"><button class="ib" id="back">‹</button><img id="dmface" style="width:34px;height:34px;image-rendering:pixelated"><div style="flex:1;min-width:0"><b class="mono" id="dmname"></b><div id="dmsess" style="font-size:11.5px;color:var(--ok)"></div></div><button class="ib" id="dmterm" style="font-size:14px">▸_</button></div>
 <div class="msgs" id="msgs"></div>
 <div class="comp"><input id="say" placeholder="Message…"><button id="send">➤</button></div>
</section>
<div class="sheetbg" id="bg"></div>
<div class="sheet" id="sheet"></div>
<div class="menu" id="menu"><div class="emo"><button>👍</button><button>❤️</button><button>😂</button><button>🙏</button><button>👀</button><button>✅</button></div><div class="acts"><button data-a="copy">⧉ Copy</button><button data-a="term">▸_ Open terminal</button><button data-a="info">ⓘ Info</button></div></div>
<div class="toast" id="toast"></div>
</div>

const $=s=>document.querySelector(s), face=n=>D.faces[n]||Object.values(D.faces)[0];
const ago=m=>m<1?"now":m<60?m+"m":m<1440?Math.floor(m/60)+"h":"Wed";
let view="now", cur="", pinned={};
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("on"),1600)}
function row(c,note){const[n,p,m,fr,ask]=c;return `<button class="row" data-open="${n}"><img src="${face(n)}" class="${D.busy.includes(n)?'ring':''}"><span class="m"><span class="t"><b>${n}</b><small>${ago(m)}</small></span><span class="p ${fr?'fr':''}">${note?`<span class="wait">${note} · </span>`:D.busy.includes(n)?'<span class="work">working · </span>':''}${p}</span></span>${fr?'<i class="dot"></i>':''}</button>`}
function strip(){return `<div class="sky">${D.live.map(n=>`<button class="f ${D.busy.includes(n)?'busy':''}" data-card="${n}"><span class="n mono">${n}</span><img src="${face(n)}"><span class="w mono">${D.busy.includes(n)?'rummaging…':'idle'}</span></button>`).join("")}</div>`}
function search(){return `<label class="search">🔍<input id="q" placeholder="Search your wolts"></label><div id="found"></div>`}
function home(){
 let h="";
 if(view=="now") h=strip()+search()+`<div class="sec">Waiting on you · 1</div>`+row(D.chats[0],"waiting on you")+`<div class="sec">Recent</div>`+D.chats.slice(1).map(c=>row(c)).join("");
 if(view=="list") h=search()+D.chats.map(c=>row(c,c[4]?"waiting on you":"")).join("");
 if(view=="grid") h=search()+`<div class="sec">Working now</div><div class="grid">${D.live.map(n=>`<button data-open="${n}" class="ring ${n=='astre'?'w':''}"><img src="${face(n)}">${n}</button>`).join("")}</div><div class="sec">Favourites</div><div class="grid">${Object.keys(D.faces).map(n=>`<button data-open="${n}"><img src="${face(n)}">${n}</button>`).join("")}</div>`;
 if(view=="ask") h=`<div class="sec">Needs you · 1</div><div class="askc"><b class="mono">astre</b> <small style="color:var(--dim)">2m</small><div>#682 and #683 are green. Merge both and cut 0.6?</div><div class="btns"><button class="y" data-ans="Merge">Merge</button><button data-ans="Later">Later</button><button data-open="astre">Open chat</button></div></div><div class="sec">Recent</div>`+D.chats.slice(1).map(c=>row(c)).join("");
 $("#homebody").innerHTML=h;
 const q=$("#q"); if(q) q.oninput=()=>{const v=q.value.trim().toLowerCase();$("#found").innerHTML=v?Object.keys(D.faces).filter(n=>n.includes(v)).map(n=>row([n,D.chats.find(c=>c[0]==n)?.[1]||"Start a chat",0,false])).join("")||'<p style="text-align:center;color:var(--dim)">No wolt by that name</p>':""}
}
function openSheet(h){$("#sheet").innerHTML='<div class="grab"></div>'+h;$("#sheet").classList.add("on");$("#bg").classList.add("on")}
function closeSheet(){$("#sheet").classList.remove("on");$("#bg").classList.remove("on")}
function card(n){const ss=D.sessions[n]||[];openSheet(`<div class="card"><img src="${face(n)}"><div><b>${n}</b><div style="font-size:12.5px;color:${D.busy.includes(n)?'var(--acc)':'var(--ok)'}" class="mono">${D.busy.includes(n)?'● rummaging…':'● idle'}</div></div></div><div class="sec" style="padding-top:0">Sessions · ${ss.length}</div>${ss.map(s=>`<div class="sess"><button class="m" data-talk="${n}|${s[0]}"><b>${s[0]}</b><span>${s[1]} · ${ago(s[2])}</span></button><button class="term" data-t="1">▸_</button></div>`).join("")||'<p style="padding:0 16px;color:var(--dim)">No live session.</p>'}<div style="height:18px"></div>`)}
function dm(n,sess){cur=n;if(sess)pinned[n]=sess;$("#dmface").src=face(n);$("#dmname").textContent=n;$("#dmsess").textContent=pinned[n]?"● "+pinned[n]:(D.sessions[n]?.[0]?.[0]?"● "+D.sessions[n][0][0]:"");
 const list=D.dm[n]||[["w",(D.chats.find(c=>c[0]==n)||[,"Say hi 👋"])[1]]];
 $("#msgs").innerHTML=(sess?`<div class="pin">pinned to “${sess}”</div>`:"")+list.map(([k,t])=>`<div class="b ${k}">${t}</div>`).join("");
 closeSheet();$("#dm").classList.remove("off");bindHold();$("#msgs").scrollTop=1e6}
function bindHold(){document.querySelectorAll(".b").forEach(b=>{let t;const s=()=>{t=setTimeout(()=>{b.classList.add("held");navigator.vibrate?.(10);$("#menu").classList.add("on")},420)},e=()=>clearTimeout(t);b.onpointerdown=s;b.onpointerup=e;b.onpointerleave=e;b.oncontextmenu=x=>x.preventDefault()})}
function sendMsg(){const i=$("#say"),t=i.value.trim();if(!t)return;i.value="";$("#msgs").insertAdjacentHTML("beforeend",`<div class="b h">${t.replace(/</g,"&lt;")}</div><div class="typing mono">${cur} is gnawing on it…</div>`);$("#msgs").scrollTop=1e6;
 setTimeout(()=>{document.querySelector(".typing")?.remove();$("#msgs").insertAdjacentHTML("beforeend",`<div class="b w">(mock) ${cur} would answer here.</div>`);bindHold();$("#msgs").scrollTop=1e6},1400)}
document.addEventListener("click",e=>{const x=e.target.closest("[data-v],[data-open],[data-card],[data-talk],[data-t],[data-ans],[data-a],.emo button");if(!x)return;
 if(x.dataset.v){view=x.dataset.v;document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t==x));home()}
 else if(x.dataset.open)dm(x.dataset.open);else if(x.dataset.card)card(x.dataset.card);
 else if(x.dataset.talk){const[n,s]=x.dataset.talk.split("|");dm(n,s)}else if(x.dataset.t)toast("Opens the session's terminal");
 else if(x.dataset.ans)toast("Sent: "+x.dataset.ans+" → astre");
 else if(x.dataset.a){$("#menu").classList.remove("on");document.querySelectorAll(".held").forEach(h=>h.classList.remove("held"));toast(x.dataset.a=="info"?"Info: from, when, session":x.dataset.a=="term"?"Opens the session's terminal":"Copied")}
 else{$("#menu").classList.remove("on");document.querySelectorAll(".held").forEach(h=>h.classList.remove("held"));toast("Reacted "+x.textContent)}});
$("#menu").addEventListener("click",e=>{if(e.target.id=="menu"){$("#menu").classList.remove("on");document.querySelectorAll(".held").forEach(h=>h.classList.remove("held"))}});
$("#bg").onclick=closeSheet;$("#back").onclick=()=>$("#dm").classList.add("off");$("#send").onclick=sendMsg;$("#say").onkeydown=e=>{if(e.key=="Enter")sendMsg()};$("#dmterm").onclick=()=>toast("Opens the session's terminal");
$("#newchat").onclick=()=>openSheet(`<div class="sec" style="padding-top:0">New chat: pick a wolt</div>${Object.keys(D.faces).map(n=>row([n,"Start a chat",0,false])).join("")}<div style="height:18px"></div>`);
home();
</script></body></html>
