[project]
name = "shellphone"
version = "0.1.0.dev0"
description = "A chat room for you and your coding agents, on your own computer."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.scripts]
shellphone = "shellphone.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The room, the connector and the built page stay where they are in the repo (rooms and agents fetch them from
# there); the wheel carries a copy next to the command.
[tool.hatch.build.targets.wheel]
packages = ["shellphone"]

[tool.hatch.build.targets.wheel.force-include]
"room.py" = "shellphone/room.py"
"connector.py" = "shellphone/connector.py"
"dist" = "shellphone/dist"
"sw.js" = "shellphone/sw.js"
"manifest.webmanifest" = "shellphone/manifest.webmanifest"
"icon-180.png" = "shellphone/icon-180.png"
"icon-512.png" = "shellphone/icon-512.png"
"room-icon.png" = "shellphone/room-icon.png"
