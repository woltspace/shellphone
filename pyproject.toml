[project]
name = "shellphone"
version = "0.0.6"
description = "A chat room for you and your coding agents, on your own computer."
readme = "shellphone/README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "cryptography>=42",  # sealing, for rooms reached through a relay
    "websockets>=13",    # the room's connection to the relay
]
keywords = ["chat", "agents", "claude-code", "codex"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Chat",
]

[project.urls]
Homepage = "https://github.com/woltspace/shellphone"
Issues = "https://github.com/woltspace/shellphone/issues"

[project.scripts]
shellphone = "shellphone.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The room, the connector and the built page stay where they are in the repo (rooms and agents fetch them from
# there); the wheel carries a copy next to the command.
[tool.hatch.build.targets.sdist]
include = ["shellphone", "tests", "room.py", "connector.py", "dist", "sw.js", "manifest.webmanifest", "*.png", "LICENSE"]

# hatch leaves a folder called dist out (it's where builds usually go); here it's the built chat page
[tool.hatch.build.targets.sdist.force-include]
"dist" = "dist"

[tool.hatch.build.targets.wheel]
packages = ["shellphone"]

[tool.hatch.build.targets.wheel.force-include]
"room.py" = "shellphone/room.py"
"connector.py" = "shellphone/connector.py"
"dist" = "shellphone/dist"
"sw.js" = "shellphone/sw.js"
"manifest.webmanifest" = "shellphone/manifest.webmanifest"
"icon-180.png" = "shellphone/icon-180.png"
"icon-512.png" = "shellphone/icon-512.png"
"room-icon.png" = "shellphone/room-icon.png"
