<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Shell Phone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Between Shell and a terminal: Shell's warm paper and terracotta, mono for names and labels, sans for what people say.
   The colours live in THEME below, so a room could pick its own later. */
html, body { margin: 0; height: 100%; background: #f5f1e8; overflow: hidden; }
body { position: fixed; inset: 0; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }  /* iPhone: stop Safari sliding the whole page up under the keyboard */
vue-advanced-chat { display: block; height: var(--vh, 100dvh); font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; }
#note { position: fixed; left: 50%; bottom: calc(76px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 9; font: 12px "JetBrains Mono", monospace; background: #fffdf6; color: #c4531e; border: 1px solid #c4531e; padding: 6px 12px; border-radius: 8px; cursor: pointer; box-shadow: 0 2px 10px rgba(24,16,10,.12); }
#bring { position: fixed; top: calc(14px + env(safe-area-inset-top)); right: 14px; z-index: 1000; font: 600 12px "JetBrains Mono", monospace; color: #c4531e; border: 1px solid #d6ccba; padding: 5px 10px; border-radius: 8px; text-decoration: none; background: #fffdf6; }
#bell { position: fixed; top: calc(14px + env(safe-area-inset-top)); right: 96px; z-index: 1000; font: 600 12px "JetBrains Mono", monospace; color: #c4531e; border: 1px solid #d6ccba; padding: 5px 10px; border-radius: 8px; background: #fffdf6; cursor: pointer; }
#viewer { position: fixed; inset: 0; z-index: 3000; background: #000e; display: grid; place-items: center; overflow: hidden; touch-action: none; }
#viewer[hidden] { display: none; }
#viewer img { max-width: 100vw; max-height: 100dvh; object-fit: contain; transform-origin: center; will-change: transform; user-select: none; -webkit-user-drag: none; pointer-events: none; }
#viewer-close { position: absolute; top: calc(14px + env(safe-area-inset-top)); right: 14px; width: 40px; height: 40px; border: 0; border-radius: 50%; background: #fff3; color: #fff; font-size: 20px; cursor: pointer; }
#note::before { content: "> "; }
#note:empty { display: none; }
.seen { display: inline-flex; gap: 1px; vertical-align: middle; margin-left: 3px; }
.seen img { width: 15px; height: 15px; image-rendering: pixelated; }
@keyframes cook { to { background-position: -300% 0; } }
@keyframes chew { 50% { transform: scaleY(.9) translateY(1px); } }
@keyframes bob { 50% { translate: 0 -2px; } }
@keyframes glow { 50% { box-shadow: 0 0 0 1px #c4531e44, 0 2px 12px #c4531e22; } }
@keyframes step { from { transform: translateY(6px); opacity: 0; } }
/* Listening: Shell's sheet. Tap the mic, talk, tap Stop: it's sent as a voice note and written down. */
#listening { position: fixed; inset: 0; z-index: 2000; background: #18100a55; }
#listening[hidden] { display: none; }
#listening .sheet { position: absolute; left: 0; right: 0; bottom: 0; top: calc(env(safe-area-inset-top) + 48px); max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; padding: 8px 18px calc(24px + env(safe-area-inset-bottom)); background: #f5f1e8; border-radius: 14px 14px 0 0; animation: rise .22s ease-out; font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; color: #18100a; }
@keyframes rise { from { transform: translateY(40px); opacity: 0; } }
#listening .grab { width: 36px; height: 5px; margin: 0 auto 16px; border-radius: 3px; background: #d6ccba; }
#listening .head { display: flex; align-items: center; gap: 10px; }
#listening .head img { width: 42px; height: 42px; image-rendering: pixelated; animation: bob 2.8s ease-in-out infinite; }
#listening h2 { margin: 0; font: 600 17px "JetBrains Mono", monospace; color: #c4531e; }
#listening p { margin: 0; color: #8a7a68; font-size: 13px; }
#wave { display: flex; align-items: center; justify-content: center; gap: 3px; height: 72px; margin-top: 28px; color: #c4531e; }
#wave i { display: block; width: 3px; height: 72px; border-radius: 2px; background: currentColor; transform: scaleY(.06); transition: transform .09s linear; }
#wave.quiet i { animation: quiet 1.4s ease-in-out infinite alternate; }
@keyframes quiet { from { transform: scaleY(.1); } to { transform: scaleY(.5); } }
#clock { text-align: center; font: 300 40px -apple-system, system-ui, sans-serif; font-variant-numeric: tabular-nums; margin-top: 6px; }
#listening .space { flex: 1; }
#rec-actions { display: flex; justify-content: center; gap: 56px; }
#rec-actions button { width: 72px; height: 72px; border: 0; border-radius: 50%; display: grid; place-items: center; cursor: pointer; }
#rec-actions svg { width: 30px; height: 30px; fill: none; stroke: #fff; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
#cancel { background: #d6ccba; } #cancel svg { stroke: #5c4d3c; }
#stop { background: #2e9d57; box-shadow: 0 4px 14px #2e9d5755; }
#rec-actions span { display: block; margin-top: 8px; text-align: center; color: #8a7a68; font: 12px "JetBrains Mono", monospace; }
@media (prefers-reduced-motion: reduce) { #listening .sheet, #listening .head img, #wave.quiet i { animation: none; } #wave i { transition: none; } }
</style>
<link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
<link rel="apple-touch-icon" href="icon-180.png?v=conch">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Shell Phone">
<meta name="theme-color" content="#f5f1e8">
<script src="vendor/vue-advanced-chat-2.1.2.umd.js"></script>
</head>
<body>
<vue-advanced-chat id="chat"></vue-advanced-chat>
<button id="bell" type="button" hidden>🔔 notify me</button>
<a id="bring" href="join">+ agent</a>
<div id="note"></div>
<div id="viewer" hidden><img id="viewer-img" alt=""><button id="viewer-close" type="button" aria-label="Close">✕</button></div>
<div id="listening" hidden><div class="sheet" role="dialog" aria-label="Listening">
  <div class="grab"></div>
  <div class="head"><img id="listen-sprite" alt=""><div><h2>Listening</h2><p>Talk, then tap send. It goes to the room as a voice note.</p></div></div>
  <div id="wave" aria-hidden="true"></div>
  <div id="clock">0:00</div>
  <div class="space"></div>
  <div id="rec-actions">
    <div><button id="cancel" type="button" aria-label="Cancel"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button><span>cancel</span></div>
    <div><button id="stop" type="button" aria-label="Send"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button><span>send</span></div>
  </div>
</div></div>
<script>
// Shell Phone on vue-advanced-chat (MIT). The room server is unchanged: this page only maps its log to the component and back.
const SPRITES = {
  raccoon: { map: ["...BB........BBB.........","...BFGG.....GFFB.........","...BABB.....BAAB.........","...BCAABBBBBACCB.........","...BAAAAAAAAAAAB.........","...BCCCCAAACCCCB.........","...BCBCCAAACCCCB.........",".BBCCBBCBCCCBCBCB........",".BBACBBCAAACBCCAB........",".BBCAAADHHHDAAACB...BBB..",".BBCAAADHHHDAAACB...BBB..","...BCAADDDDDAEEB...BCCCB.","....BCCCCEEECBB....BAAACB","...BAAAAAAAAAAAB...BCCCBB","...BAAAAAAAAAAAB...BCCCCB",".BBAAAAAAAAAAAAAB..BAAAAB",".BBAABBAAAAABAAAB..BCCCCB",".BBAAAABAAABAAAABBBAACCCB",".GGFAAABAAABAAAAGBBAABBCG","BAABAAABAAABAAABABBCAAAB.","BAAABBBBAAABBBBAABBCCBB..","BCCAAAAAAAAAAAAACBBBB....",".BBBBGGAAAAAGBBBB........",".BBCCBBAAAAABCCCB........","...BBBBBBBBBBBBB........."],
    colors: { A: "#7f8894", B: "#282c33", C: "#40454b", D: "#f0ecf0", E: "#545c65", F: "#a0abbd", G: "#050029", H: "#efa09f" } },
  beaver: { map: ["..AAA........AAA.....",".ABBBA......ABBBA....",".ABAAAAAAAAAAAABA....",".ABABBBBBBBBBAABA....","..ABBBBBBBBBBBAA.....","..ABABBBBAEBBBAA.....","..ABABBBBAEBBBAA.....",".ABBAAAABAEBBBBA.....",".ABACAACCCFABBBA.....",".ABACCACCCFABBBA.AAA.",".ABBAAAAAAEBBBAAADDDA","..ABBCAFABBBBAA.AADDA","...ABAAAABBBBBBAADADA","..ABBBBBBBBBBBBAADDAA",".ABBABCCCAEBBBBBAADDA",".ABBACCCABBBBABBADADA",".AGGACCCAGGGGABBADADA","..AAACCCAAAAABBBADDA.","..ABCCCCCCFABBBBAAAA.",".AAABCCCCAAAABBBAA...","ABBBACCCABBBBBBAA....","AAAAAAAAAAAAAAAA....."],
    colors: { A: "#3f190e", B: "#af6127", C: "#fce6b0", D: "#773c1f", E: "#050003", F: "#fffee7", G: "#dd7a2d" } },
};
// While a wolt works, its sprite chews above the box with a line of lore, like the Becky app.
const LORE = {
  beaver: ["Gnawing on it…", "Hauling some logs…", "Patching the dam…", "Packing the mud…", "Stacking branches…", "Slapping the tail…"],
  raccoon: ["Gnawing on it…", "Rummaging through the bins…", "Washing it in the creek…", "Sniffing out the bug…", "Stashing the shiny bits…", "Peeking under the lid…"],
};
const $ = (id) => document.getElementById(id);
const chat = $("chat");
const dark = false;  // light paper, like Shell
const THEME = { bg: "#f5f1e8", panel: "#fffdf6", line: "#d6ccba", text: "#18100a", dim: "#8a7a68", accent: "#c4531e" };
const q = new URLSearchParams(location.search);
if (q.get("as")) document.cookie = "as=" + encodeURIComponent(q.get("as")) + "; path=/; SameSite=Strict";
window["vue-advanced-chat"].register();

const svgUri = (svg) => "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
function spriteRects(creature) {
  const { map, colors } = SPRITES[creature] || SPRITES.raccoon;
  let rects = "";
  map.forEach((row, y) => [...row].forEach((c, x) => { if (colors[c]) rects += `<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="${colors[c]}"/>`; }));
  return { rects, side: Math.max(map.length, ...map.map((r) => r.length)) };
}
// Avatars carry the person's colour: a filled circle for a person, their colour as a ring behind each of their wolts.
function personAvatar(name, color) {
  const ch = (name || "?").trim()[0].toUpperCase().replace(/[<&]/g, "");
  return svgUri(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><circle cx="20" cy="20" r="20" fill="${color}"/><text x="20" y="26" text-anchor="middle" font-family="monospace" font-weight="700" font-size="18" fill="#fff">${ch}</text></svg>`);
}
function woltAvatar(creature, color) {
  const { rects, side } = spriteRects(creature);
  const pad = side * 0.25, box = side + pad * 2;
  return svgUri(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="${-pad} ${-pad} ${box} ${box}" shape-rendering="crispEdges"><circle cx="${side / 2}" cy="${side / 2}" r="${box / 2 - 1}" fill="${color}33" stroke="${color}" stroke-width="1.6"/>${rects}</svg>`);
}

const unfolded = new Set();  // voice notes whose words someone tapped open
const key = (m) => m.cid || m.id;  // a voice note keeps the id its sender's page gave it, so the bubble never changes
let state = { me: "", title: "shell", members: { people: [], wolts: [] }, working: {} };
let after = 0, msgs = [], byId = {}, heard = new Set(), first = true, queue = [], player = null, shown = {};
const person = (email) => state.members.people.find((p) => p.email === email) || { name: email, color: "#8a6a52" };
const woltId = (w) => "wolt:" + w;

function users() {
  return [
    ...state.members.people.map((p) => ({ _id: p.email, username: p.name, avatar: personAvatar(p.name, p.color) })),
    ...state.members.wolts.map((w) => ({ _id: woltId(w.wolt), username: w.wolt, avatar: woltAvatar(w.creature, person(w.owner).color) })),
  ];
}
// "@testie" in the log becomes a clickable tag; a tag picked in the box goes back to the log as "@testie".
function toTags(text) {
  const names = new Map(users().map((u) => [u.username.toLowerCase(), u._id]));
  return text.replace(/(^|\s)@([\w-]+)/g, (all, sp, n) => names.has(n.toLowerCase()) ? `${sp}<usertag>${names.get(n.toLowerCase())}</usertag>` : all);
}
function fromTags(text) {
  const byIdU = new Map(users().map((u) => [u._id, u.username]));
  return text.replace(/<usertag>(.*?)<\/usertag>/g, (all, id) => "@" + (byIdU.get(id) || id));
}

function toMessage(m) {
  const d = new Date(m.at * 1000);
  const human = m.kind === "human";
  const owner = human ? m.email : m.owner;
  // The chat kit spots a video by its type: tell it iPhone .mov and .m4v are videos too.
  const kind = m.file ? ({ mov: "video/quicktime", m4v: "video/mp4" }[m.file.type] || m.file.type) : "";
  const files = m.file ? [{ name: m.file.name.replace(/\.[^.]*$/, ""), extension: m.file.type, type: kind, url: m.file.url, size: m.file.size }] : undefined;
  const base = {
    _id: key(m), indexId: m.shownN || m.n, senderId: human ? m.email : woltId(m.wolt),
    username: human ? person(m.email).name : `${m.wolt} · ${owner === state.me ? "yours" : person(owner).name + "'s"}`,
    avatar: human ? personAvatar(person(m.email).name, person(m.email).color) : woltAvatar(m.creature, person(owner).color),
    content: toTags(m.text || ""), date: d.toLocaleDateString([], { day: "numeric", month: "long" }),
    timestamp: d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }),
    saved: true, distributed: true, disableReactions: true,
  };
  if (!m.audio) return [{ ...base, files }];
  // One bubble per voice note, with the same id from the moment you tap stop to when its words arrive, so nothing flashes.
  // The kit shows a voice note without words, so voiceWords() puts the words (or a spinner) into the bubble itself.
  return [{ ...base, _id: key(m), content: "", files: [{ name: "voice", type: "mp3", audio: true, url: m.localUrl || "voice/" + m.audio, size: 0 }] }];
}

function slashCommands() {
  const mine = state.members.wolts.filter((w) => w.owner === state.me).map((w) => "@" + w.wolt);
  const all = state.members.wolts.map((w) => "@" + w.wolt).join(" ");
  const others = state.members.wolts.filter((w) => w.owner !== state.me).map((w) => "@" + w.wolt);
  return [
    { tag: "status", text: `${all} what are you each working on right now?` },
    { tag: "review", text: `${others[0] || all} please review ` },
    { tag: "summary", text: `${mine[0] || all} sum up what this room decided so far` },
    { tag: "handoff", text: `${mine[0] || all} write a handoff for ${others[0] || "the others"}: what's done, what's next, what's risky` },
  ];
}

function set(prop, value) {  // the component re-renders on every set, so only set what changed
  const v = typeof value === "string" ? value : JSON.stringify(value);
  if (shown[prop] === v) return;
  shown[prop] = v;
  chat.setAttribute(prop, v);
}

function render() {
  set("current-user-id", state.me);
  set("styles", styles());
  set("rooms", [{
    roomId: "room", roomName: state.title || "shell",
    avatar: "room-icon.png", users: users(),  // the app icon: the beaver and its shell phone
    typingUsers: [],  // #gnaw shows who's working instead
  }]);
  set("templates-text", slashCommands());
  const real = new Map(msgs.filter((m) => !m.pending && m.cid).map((m) => [m.cid, m]));
  for (const m of msgs) {  // the room's copy keeps playing the recording already on this page, so the player isn't rebuilt
    if (m.pending && real.has(m.cid) && !real.get(m.cid).localUrl) Object.assign(real.get(m.cid), { localUrl: m.localUrl, shownN: m.n });
  }
  msgs = msgs.filter((m) => !(m.pending && real.has(m.cid)));
  set("messages", msgs.flatMap(toMessage));
  set("messages-loaded", "true");
  hackerCss();
  takeMic();
  takeAudio();
  watchBubbles();
  gnaw();
  receipts();
  requestAnimationFrame(() => { voiceWords(); drawCards(); });
}
// A voice note's words sit in its own bubble, under the player: a spinner while the room writes them down, then the words.
// The words fold to one line behind ▸ (tap for all), for people and wolts alike.
function voiceWords() {
  const root = chat.shadowRoot;
  if (!root) return;
  for (const m of msgs) {
    if (!m.audio) continue;
    const wrap = root.getElementById(key(m));
    const card = wrap && wrap.querySelector(".vac-message-card");
    const player = card && card.querySelector(".vac-audio-player");
    if (!player) continue;
    let w = wrap.querySelector(".sp-words");
    if (!w) {  // under the player and its length line
      w = document.createElement("div"); w.className = "sp-words";
      const box = player.parentNode, length = box.nextElementSibling;  // the player's box, then its "00:12" line
      box.parentNode.insertBefore(w, length ? length.nextSibling : null);
    }
    const folded = !unfolded.has(key(m));
    const sig = (m.pending ? "…" : m.text) + folded;
    if (w.dataset.sig === sig) continue;
    w.dataset.sig = sig;
    w.classList.toggle("folded", folded);
    w.classList.toggle("mine", !m.pending);
    w.classList.toggle("pending", !!m.pending);
    w.innerHTML = m.pending ? '<i class="sp-spin"></i><svg class="sp-mic" viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-2.1A7 7 0 0 0 19 12h-2Z"/></svg>transcribing' : "";
    if (!m.pending) w.textContent = m.text || "";
  }
}
// Read receipts: each wolt that read your message leaves its sprite where the checkmark goes. Working ones also chew in #gnaw.
function receipts() {
  for (const m of msgs) {
    if (m.kind !== "human" || m.email !== state.me) continue;
    const who = (state.seen || {})[m.id] || [];
    if (!who.length) continue;
    const slot = "checkmark-icon_" + m.id, sig = who.join(",");
    let el = chat.querySelector(`[slot="${slot}"]`);
    if (el && el.dataset.sig === sig) continue;
    if (!el) { el = document.createElement("span"); el.slot = slot; el.className = "seen"; chat.append(el); }
    el.dataset.sig = sig; el.title = "Read by " + who.join(", "); el.replaceChildren();
    for (const name of who) {
      const w = state.members.wolts.find((x) => x.wolt === name);
      const img = document.createElement("img"); img.alt = name;
      img.src = woltAvatar(w ? w.creature : "raccoon", person(w ? w.owner : "").color); el.append(img);
    }
  }
}
// Who's working sits at the bottom of the chat itself, after the last message, so it scrolls with it and covers nothing.
function gnawBox() {
  const list = chat.shadowRoot && chat.shadowRoot.querySelector(".vac-messages-container");
  if (!list) return document.createElement("div");
  let box = list.querySelector("#gnaw");
  if (!box) { box = document.createElement("div"); box.id = "gnaw"; }
  if (list.lastElementChild !== box) list.append(box);
  return box;
}
let loreTick = 0;
function gnaw() {
  const on = state.members.wolts.filter((w) => (state.working || {})[w.wolt]);
  const box = gnawBox();
  box.querySelectorAll(".w:not(.bye)").forEach((n) => {  // fold away, then leave, so the chat doesn't jump
    if (!on.some((w) => w.wolt === n.dataset.wolt)) { n.classList.add("bye"); setTimeout(() => n.remove(), 260); }
  });
  for (const w of on) {
    if (box.querySelector(`[data-wolt="${w.wolt}"]:not(.bye)`)) continue;
    const row = document.createElement("div"); row.className = "w"; row.dataset.wolt = w.wolt;
    const img = document.createElement("img"); img.src = woltAvatar(w.creature, person(w.owner).color); img.alt = "";
    const line = document.createElement("span"); line.className = "lore";
    row.append(img, line); box.append(row); setLore(row, w);
  }
}
function setLore(row, w) {
  const lines = LORE[w.creature] || LORE.beaver, line = row.querySelector(".lore");
  line.textContent = `${w.wolt}: ${lines[(loreTick + w.wolt.length) % lines.length]}`;
  line.classList.remove("new"); void line.offsetWidth; line.classList.add("new");
}
setInterval(() => { loreTick++; gnawBox().querySelectorAll(".w").forEach((row) => {
  const w = state.members.wolts.find((x) => x.wolt === row.dataset.wolt); if (w) setLore(row, w); }); }, 2400);

// iPhone Safari doesn't shrink the page for the keyboard, so size the chat to the part of the screen that's still visible.
function fit() {
  const h = window.visualViewport ? Math.round(visualViewport.height) + "px" : "100dvh";
  document.documentElement.style.setProperty("--vh", h);
  if (window.visualViewport) document.documentElement.style.setProperty("--kb", Math.max(0, innerHeight - visualViewport.height) + "px");
  chat.setAttribute("height", h);
  window.scrollTo(0, 0);
}
fit();
if (window.visualViewport) { visualViewport.addEventListener("resize", fit); visualViewport.addEventListener("scroll", () => window.scrollTo(0, 0)); }
chat.setAttribute("single-room", "true");
chat.setAttribute("media-preview-enabled", "false");  // pictures open in our own viewer, which can zoom
chat.setAttribute("room-id", "room");
chat.setAttribute("show-add-room", "false");
chat.setAttribute("show-search", "false");
chat.setAttribute("show-reaction-emojis", "false");
chat.setAttribute("theme", dark ? "dark" : "light");
chat.setAttribute("message-actions", JSON.stringify([{ name: "replyMessage", title: "Reply" }]));
chat.setAttribute("username-options", JSON.stringify({ minUsers: 0, currentUser: false }));
chat.setAttribute("text-messages", JSON.stringify({ TYPE_MESSAGE: "$ message, @wolt, or /", MESSAGES_EMPTY: "Nobody has said anything yet. Tag a wolt with @ to bring it in.", IS_TYPING: "is compiling a reply…" }));
function mix(hex, to, t) {  // blend a colour toward white or black, so text stays readable on it
  const c = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  const [a, b] = [c(hex), c(to)];
  return "#" + a.map((v, i) => Math.round(v + (b[i] - v) * t).toString(16).padStart(2, "0")).join("");
}
function styles() {  // terminal colours; your bubbles still wear your colour
  const mine = person(state.me).color, T = THEME;
  return { general: { color: T.text, colorCaret: T.accent, backgroundColorButton: mine, colorButtonClear: T.accent,
                      backgroundInput: T.bg, colorPlaceholder: T.dim, colorSpinner: T.accent, borderStyle: `1px solid ${T.line}` },
           container: { borderRadius: "0", boxShadow: "none" },
           header: { background: T.panel, colorRoomName: T.accent, colorRoomInfo: T.dim },
           footer: { background: T.panel, borderStyleInput: `1px solid ${T.line}`, borderInputSelected: T.accent,
                     backgroundReply: T.bg, backgroundTagActive: T.line, backgroundTag: T.panel },

    const name = f.extension && !f.name.endsWith("." + f.extension) ? `${f.name}.${f.extension}` : f.name;
    await say(`api/files?name=${encodeURIComponent(name)}&text=${encodeURIComponent(i === 0 ? text : "")}`, { method: "POST", headers: { "Content-Type": "application/octet-stream" }, body: f.blob });
  }
  if (text && !other.length) await say("api/messages", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text }) });
});
chat.addEventListener("open-file", (e) => {
  const { file } = e.detail[0];
  if (!file || !file.file || !file.file.url) return;
  if (/^(png|jpe?g|gif|webp|avif|heic|bmp)$/i.test(file.file.type || "") || /^image\//.test(file.file.type || "")) viewImage(file.file.url);
  else window.open(file.file.url, "_blank");
});
// Pictures open full screen: pinch to zoom, drag to look around, double-tap to zoom in or out, ✕ or a tap outside to close.
const view = { s: 1, x: 0, y: 0, pts: new Map(), pinch: null, lastTap: 0 };
function viewImage(url) {
  Object.assign(view, { s: 1, x: 0, y: 0, pinch: null }); view.pts.clear();
  $("viewer-img").src = url; drawView(); $("viewer").hidden = false;
}
function drawView() { $("viewer-img").style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.s})`; }
function zoomAt(cx, cy, s) {  // keep the point under the finger(s) where it is
  const r = $("viewer").getBoundingClientRect(), px = cx - r.width / 2, py = cy - r.height / 2;
  s = Math.min(6, Math.max(1, s));
  view.x = px - (px - view.x) * (s / view.s); view.y = py - (py - view.y) * (s / view.s); view.s = s;
  if (s === 1) { view.x = 0; view.y = 0; }
  drawView();
}
$("viewer").addEventListener("pointerdown", (e) => {
  view.pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (view.pts.size === 2) { const [a, b] = [...view.pts.values()]; view.pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), s: view.s }; }
});
$("viewer").addEventListener("pointermove", (e) => {
  const prev = view.pts.get(e.pointerId); if (!prev) return;
  view.pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (view.pts.size === 2 && view.pinch) {
    const [a, b] = [...view.pts.values()];
    zoomAt((a.x + b.x) / 2, (a.y + b.y) / 2, view.pinch.s * Math.hypot(a.x - b.x, a.y - b.y) / view.pinch.d);
  } else if (view.pts.size === 1 && view.s > 1) { view.x += e.clientX - prev.x; view.y += e.clientY - prev.y; drawView(); }
});
function liftView(e) {
  if (!view.pts.has(e.pointerId)) return;
  view.pts.delete(e.pointerId); if (view.pts.size < 2) view.pinch = null;
  if (e.type !== "pointerup" || view.pts.size) return;
  const now = Date.now();
  if (now - view.lastTap < 300) { zoomAt(e.clientX, e.clientY, view.s > 1 ? 1 : 2.5); view.lastTap = 0; }
  else { view.lastTap = now; if (view.s === 1 && e.target === $("viewer")) setTimeout(() => { if (view.lastTap === now) $("viewer").hidden = true; }, 300); }
}
$("viewer").addEventListener("pointerup", liftView);
$("viewer").addEventListener("pointercancel", liftView);
$("viewer-close").onclick = (e) => { e.stopPropagation(); $("viewer").hidden = true; };
// Notifications: the home-screen app registers a service worker; "notify me" asks once, then the room pushes new messages
// to this phone whenever the room isn't on screen.
const b64key = (k) => Uint8Array.from(atob(k.replace(/-/g, "+").replace(/_/g, "/") + "=".repeat(-k.length & 3)), (c) => c.charCodeAt(0));
async function pushSetup(ask) {
  if (!("serviceWorker" in navigator) || !("PushManager" in window) || !window.Notification) return;
  const { key } = await (await fetch("api/push")).json().catch(() => ({}));
  if (!key) return;
  const reg = await navigator.serviceWorker.register("sw.js");
  if (Notification.permission === "default" && !ask) { $("bell").hidden = false; return; }
  if (Notification.permission === "default" && (await Notification.requestPermission()) !== "granted") return;
  if (Notification.permission !== "granted") { $("bell").hidden = true; return; }
  await navigator.serviceWorker.ready;
  const sub = (await reg.pushManager.getSubscription()) || (await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64key(key) }));
  await fetch("api/push", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ subscription: sub.toJSON() }) });
  $("bell").hidden = true;
  if (ask) $("note").textContent = "Notifications on for this phone.";
}
$("bell").onclick = () => pushSetup(true).catch((e) => { $("note").textContent = "Couldn't turn on notifications: " + e.message; });
pushSetup(false).catch(() => {});
poll();
</script>
