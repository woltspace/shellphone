# The shellphone relay: one small Worker and one Durable Object per live room. It passes sealed frames between a
# room's host and its clients, and serves the pages. It keeps no frames: only how many rooms are open, and a few totals per day.
#
#   npx wrangler dev --local          # run it on your own computer (no account needed)
#   npx wrangler deploy               # needs Cloudflare access to the account that owns the domain
#   npx wrangler secret put HOST_KEY  # hosts must know it to open rooms; with none set, nobody can host
name = "shellphone-relay"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = false
preview_urls = false
routes = [{ pattern = "shellphone.woltspace.app", custom_domain = true }]

[vars]
RELAY_OFF = ""        # set to "1" to turn the whole relay off: every request and socket is refused
OPEN_HOSTING = ""     # leave empty: only hosts that know HOST_KEY can open rooms. "1" lets anyone host: a decision, not a default
MAX_ROOMS = "20"           # rooms open at the same time, at the most. A host beyond that is told to try later
MAX_ROOMS_PER_DAY = "200"  # new rooms in one day (UTC), at the most
BEAT_SECONDS = ""          # how often an open room reports to the desk (empty: every 30 minutes). Tests shorten it

[build]
command = "sh build.sh"   # site/ = public/ + the chat page from ../dist

[assets]
directory = "./site"
binding = "ASSETS"
html_handling = "none"    # pages are served at the addresses below, never by a redirect that would drop a room link

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "DESK"
class_name = "Desk"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Desk"]
