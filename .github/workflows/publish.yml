name: Publish to PyPI

# Run by hand, from the branch to release. The tests run, the package is built, and then the run waits at the
# "pypi" environment for an approval before anything is uploaded. PyPI trusts this workflow in that environment
# (trusted publishing), so no token is stored anywhere.
on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to publish, exactly as in pyproject.toml (for example 0.0.2)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-shellphone
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Only main or integration, and only this repository
        env:
          REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          printf '%s\n' "$REF" | grep -Eqx 'refs/heads/(main|integration)'
          test "$REPOSITORY" = woltspace/shellphone
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: "The version asked for is the version in the code, and is not on PyPI yet"
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import os, re, sys, tomllib, urllib.error, urllib.request
          asked = os.environ["VERSION"]
          if not re.fullmatch(r"\d+\.\d+\.\d+", asked):
              sys.exit(f"not a plain version: {asked!r}")
          have = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          if have != asked:
              sys.exit(f"pyproject.toml says {have}, you asked for {asked}")
          try:
              urllib.request.urlopen(f"https://pypi.org/pypi/shellphone/{asked}/json", timeout=20)
              sys.exit(f"shellphone {asked} is already on PyPI: versions can't be replaced")
          except urllib.error.HTTPError as e:
              if e.code != 404:
                  raise
          PY
      - name: Tests
        run: python -m unittest discover tests -v
      - name: Build into out/ (dist/ is the built chat page)
        run: |
          python -m pip install --quiet build==1.2.2.post1
          python -m build --outdir out
          ls -l out
      - name: The wheel runs on its own
        run: |
          python -m venv /tmp/try && /tmp/try/bin/pip install --quiet out/*.whl
          cd /tmp && /tmp/try/bin/shellphone version && /tmp/try/bin/shellphone room --help > /dev/null
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: shellphone-${{ inputs.version }}
          path: out/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/shellphone/${{ inputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: shellphone-${{ inputs.version }}
          path: out
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: out
